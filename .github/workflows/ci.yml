name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    # 30 of this module's 47 tests need Mongo and SKIP without it. A green run
    # that skipped two thirds of the suite is worse than no run — it is a claim
    # of coverage that was never exercised. The service container is what makes
    # the result mean something.
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: redelay
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      # Without this, Go asks the public proxy for private modules
      # (redelay/*, dreplyai/go-assistant-core) and fails with "unknown
      # revision" rather than anything that mentions access.
      GOPRIVATE: github.com/redelay/*,github.com/flowdsl/*,github.com/FlowDSL/*,github.com/AsyncShop/*,github.com/dreplyai/*,github.com/DreplyAI/*
      TEST_MONGO_URI: mongodb://admin:redelay@localhost:27017/?authSource=admin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # GITHUB_TOKEN reaches only the repository running the workflow, so it
      # cannot fetch redelay/* or the kernel. Owning the orgs does not change
      # that — the constraint is the token's scope, not permission.
      #
      # An App installation token is scoped to the account it is installed on,
      # so two orgs means two tokens. Both are short-lived and vanish with the
      # job. Requires variable CI_APP_ID and secret CI_APP_PRIVATE_KEY, with the
      # App installed on redelay and DreplyAI.
      - name: Token for redelay
        id: redelay
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: redelay

      - name: Token for DreplyAI
        id: dreply
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: DreplyAI

      - name: Route private fetches through the App tokens
        run: |
          # Rewrites are per-org, not a blanket github.com rule: each token is
          # only valid for its own installation, so a single rule would send
          # redelay's token to DreplyAI and get a 404 that looks like a missing
          # tag.
          git config --global \
            url."https://x-access-token:${{ steps.redelay.outputs.token }}@github.com/redelay/".insteadOf \
            "https://github.com/redelay/"
          # Keyed on the LOWERCASE org, because that is what Go requests: the
          # module path is github.com/dreplyai/go-assistant-core even though the
          # repository is DreplyAI/…, and insteadOf matches the URL literally.
          # Case-correct here and the rewrite silently never fires.
          git config --global \
            url."https://x-access-token:${{ steps.dreply.outputs.token }}@github.com/dreplyai/".insteadOf \
            "https://github.com/dreplyai/"

      # go.work is gitignored and must never appear here: it would build the
      # kernel from a sibling checkout that does not exist on a runner, and —
      # worse, if it somehow did — would hide whether the pinned version
      # actually works. This job exists to prove the pin.
      - name: No workspace override
        run: |
          test ! -f go.work || { echo "::error::go.work is committed — it must stay local"; exit 1; }
          ! grep -qE '^\s*replace\s+github\.com/dreplyai/go-assistant-core' go.mod \
            || { echo "::error::go.mod replaces go-assistant-core with a local path"; exit 1; }

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test cache: a cached pass from a run where the
      # Mongo service was unhealthy would otherwise look like a real one.
      - name: Test
        run: go test ./... -count=1
